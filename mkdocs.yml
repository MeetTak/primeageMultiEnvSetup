# Docs site for GitHub Pages, built by .github/workflows/docs.yml on every push to main.
# Local preview:  pip install -r requirements-docs.txt && mkdocs serve
# Local check:    mkdocs build --strict   (fails on broken links / anchors)
site_name: .personal
site_description: macOS dotfiles and dev environment, modelled on ThePrimeagen/dev
site_url: https://meettak.github.io/primeageMultiEnvSetup/
repo_url: https://github.com/MeetTak/primeageMultiEnvSetup
repo_name: MeetTak/primeageMultiEnvSetup
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Guide: GUIDE.md

theme:
  name: material
  icon:
    logo: material/console
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant        # page loads without a full refresh
    - navigation.tracking       # URL follows the section you're reading
    - navigation.top            # "back to top" button
    - navigation.footer
    - toc.follow                # outline highlights the current section
    - search.suggest
    - search.highlight
    - content.code.copy         # copy button on code blocks
    - content.action.edit       # "edit this page" on GitHub

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true           # ¶ link next to every heading
      toc_depth: 3              # page title › Part › section

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn                 # with --strict, a broken #anchor fails the build
