# tmux config — your old ~/.tmux.conf + ThePrimeagen's dev/env/.config/tmux/tmux.conf
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s escape-time 0

# prefix: C-a (Primeagen) instead of C-b
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# vi copy mode, yank to the macOS clipboard
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# todo list: the project's TODO.md, else the one in the dotfiles repo
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.personal/todo.md"

# tmux-sessionizer: fuzzy-pick a project, then jump into (or create) its session
bind-key -r f run-shell "tmux neww tmux-sessionizer"
# per-session long-running commands (TS_SESSION_COMMANDS in tmux-sessionizer.conf)
bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-s run-shell "tmux neww tmux-sessionizer -s 3"

# lazygit popup in the current folder
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# ---------- plugins (install with prefix + I, or ./run tmux) ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dracula/tmux'
set -g @continuum-restore 'on'
set -g @dracula-show-powerline true
set -g @dracula-plugins "cpu-usage ram-usage"

# keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
