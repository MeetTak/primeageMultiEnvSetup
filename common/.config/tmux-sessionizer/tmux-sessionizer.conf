# Config for tmux-sessionizer (github.com/ThePrimeagen/tmux-sessionizer, submodule in the repo)

# folders whose sub-folders show up in the picker (depth 1):
#   projectGithub → every project, /Users/sandbox → docker, matAI, ...,
#   ~/ → ~/.personal and other home folders, ~/.config → app configs
# A ":N" suffix sets a depth, but the script keeps that depth for every later
# entry, so put any ":N" entries last.
TS_SEARCH_PATHS=(/Users/sandbox/projectGithub /Users/sandbox ~/ ~/.config)

# long-running per-session commands, opened at window 69+ so they never clash with yours
#   Alt-h → claude   Alt-t → lazygit   (zsh, tmux and nvim all bind these)
TS_SESSION_COMMANDS=(claude lazygit)

# TS_LOG=file   # debug: logs to ~/.local/share/tmux-sessionizer/tmux-sessionizer.logs
